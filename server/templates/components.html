{{ define "navbar-tailwind" }}
<nav class="bg-slate-100 text-slate-950 shadow-md dark:bg-slate-900 dark:text-white">

  <div class="mx-auto flex max-w-full items-center justify-between px-4 py-4 sm:px-6 lg:px-8">

    <!-- left -->
    <div class="flex items-center justify-between gap-6">
      <div class="flex items-center gap-2">
        <svg id="page-logo"
          xmlns="http://www.w3.org/2000/svg" 
          width="32" height="32" 
          viewBox="0 0 24 24" 
          fill="none" stroke="currentColor" 
          stroke-width="2" stroke-linecap="round" 
          stroke-linejoin="round" >
          <path d="m15 11-1 9"/><path d="m19 11-4-7"/>
          <path d="M2 11h20"/><path d="m3.5 11 1.6 7.4a2 2 0 0 0 2 1.6h9.8a2 2 0 0 0 2-1.6l1.7-7.4"/>
          <path d="M4.5 15.5h15"/><path d="m5 11 4-7"/><path d="m9 11 1 9"/>
        </svg>
        <a href="#"
           class="text-xl font-bold tracking-tight">
            My Store
        </a>
      </div>

      <div class="flex sr-only md:not-sr-only gap-4 text-slate-800 transition dark:text-slate-200">
        <a href="#" class="hover:text-slate-950 dark:hover:text-white">Products</a>
        <a href="#" class="hover:text-slate-950 dark:hover:text-white">About</a>
        <a href="#" class="hover:text-slate-950 dark:hover:text-white">Home</a>
      </div>
    </div>

    <!-- right -->
    <div class="flex items-center justify-between gap-6">
      <div class="flex items-center justify-between gap-4">

        <!-- search -->
        <div>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-search preview-icon"><path d="m21 21-4.34-4.34"/><circle cx="11" cy="11" r="8"/></svg>
        </div>

        <!-- dark theme -->
        <div class="relative">

          <!-- icon -->
          <button id="theme-menu-button"
                  type="button"
                  aria-label="Change theme"
                  aria-expanded="false"
                  aria-controls="theme-menu"
                  class="rounded-lg p-2 transition hover:bg-slate-700 focus-visible:outline-2 focus-visible:outline-offset-2">

              <svg id="theme-icon-system"
                   xmlns="http://www.w3.org/2000/svg"
                   width="22" height="22"
                   viewBox="0 0 24 24"
                   fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="12" rx="2"/>
                  <path d="M8 20h8m-4-4v4"/>
              </svg>

              <svg id="theme-icon-light"
                   class="hidden"
                   xmlns="http://www.w3.org/2000/svg"
                   width="22" height="22"
                   viewBox="0 0 24 24"
                   fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round">
                  <circle cx="12" cy="12" r="4"/>
                  <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
              </svg>

              <svg id="theme-icon-dark"
                   class="hidden"
                   xmlns="http://www.w3.org/2000/svg"
                   width="22" height="22"
                   viewBox="0 0 24 24"
                   fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round"
                   stroke-linejoin="round">
                  <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.463.402.807a6.5 6.5 0 0 0 8.268 8.268c.344-.215.829-.003.803.397z"/>
              </svg>
          </button>

          <!-- menu -->
          <div id="theme-menu"
               class="absolute right-0 z-50 mt-2 hidden w-36 rounded-lg border border-slate-700 bg-slate-800 p-1 shadow-lg">

              <button type="button"
                      data-theme-option="system"
                      class="flex w-full items-center gap-3 rounded-md px-3 py-2 text-sm text-white hover:bg-slate-700">

                  <svg xmlns="http://www.w3.org/2000/svg"
                       class="h-5 w-5 shrink-0"
                       viewBox="0 0 24 24" fill="none"
                       stroke="currentColor" stroke-width="2"
                       stroke-linecap="round" stroke-linejoin="round">
                      <rect x="3" y="4" width="18" height="12" rx="2"/>
                      <path d="M8 20h8m-4-4v4"/>
                  </svg>

                  <span>System</span>
              </button>

              <button type="button"
                      data-theme-option="light"
                      class="flex w-full items-center gap-3 rounded-md px-3 py-2 text-sm text-white hover:bg-slate-700">

                  <svg xmlns="http://www.w3.org/2000/svg"
                       class="h-5 w-5 shrink-0"
                       viewBox="0 0 24 24" fill="none" 
                       stroke="currentColor" stroke-width="2" 
                       stroke-linecap="round" stroke-linejoin="round">
                      <circle cx="12" cy="12" r="4"/>
                      <path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>
                  </svg>

                  <span>Light</span>
              </button>

              <button type="button"
                      data-theme-option="dark"
                      class="flex w-full items-center gap-3 rounded-md px-3 py-2 text-sm text-white hover:bg-slate-700">

                  <svg xmlns="http://www.w3.org/2000/svg"
                       class="h-5 w-5 shrink-0"
                       viewBox="0 0 24 24" fill="none" 
                       stroke="currentColor" stroke-width="2" 
                       stroke-linecap="round" stroke-linejoin="round">
                      <path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.463.402.807a6.5 6.5 0 0 0 8.268 8.268c.344-.215.829-.003.803.397z"/>
                  </svg>

                  <span>Dark</span>
              </button>
          </div>
        </div>
      </div>

      <div class="flex items-center justify-between gap-4">

        <!-- cart -->
        <div>
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-shopping-cart preview-icon"><path d="m2.05 2.05 1.099-.028a1 1 0 0 1 1.008.815l2.69 14.347A1 1 0 0 0 7.83 18H18"/><path d="M4.563 5h16.435a1 1 0 0 1 .981 1.204l-1.026 6.226A2 2 0 0 1 18.962 14H6.25"/><circle cx="18" cy="20" r="2"/><circle cx="8" cy="20" r="2"/></svg>
        </div>

        <!-- user -->
        <div>
          <button type="button"
                  class="flex w-full items-center gap-2 rounded-lg shadow-md px-2 py-2 text-sm text-slate-950 dark:text-white hover:bg-slate-500">
                  
              <span>Login</span>              
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user preview-icon"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>      
          </button>
          
        </div>
      </div>
    </div>
  </div>
</nav>
{{ end }}
